# 301 redirects: .html → clean URLs
# Add these rules inside your server {} block in Nginx config
# (typically at /etc/nginx/sites-enabled/cariboo.services)

# Redirect .html pages to clean URLs
rewrite ^/index\.html$          /           permanent;
rewrite ^/painting\.html$       /painting   permanent;
rewrite ^/fencing\.html$        /fencing    permanent;
rewrite ^/landscaping\.html$    /landscaping permanent;
rewrite ^/gutter-cleaning\.html$ /gutter-cleaning permanent;
rewrite ^/labour\.html$         /labour     permanent;
rewrite ^/contact\.html$        /contact    permanent;

# Serve clean URLs from .html files
location = /painting        { try_files /painting.html =404; }
location = /fencing         { try_files /fencing.html =404; }
location = /landscaping     { try_files /landscaping.html =404; }
location = /gutter-cleaning { try_files /gutter-cleaning.html =404; }
location = /labour          { try_files /labour.html =404; }
location = /contact         { try_files /contact.html =404; }
